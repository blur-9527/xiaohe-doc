<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="动态读取 GitHub 仓库中代码文件的代码文档。">
<title>代码星图</title>
<style>
:root { --ink:#4d3b5d; --muted:#8e7d9e; --paper:rgba(255,255,255,.88); --line:rgba(191,146,190,.3); --pink:#ef92b5; --pink-deep:#d95e93; --lilac:#9e8add; --aqua:#8fd9df; --code:#27243d; --code-top:#3b3558; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { min-height:100vh; margin:0; overflow-x:hidden; color:var(--ink); background:radial-gradient(circle at 8% 13%,rgba(255,255,255,.98) 0 2px,transparent 2.8px),radial-gradient(circle at 88% 11%,rgba(255,255,255,.92) 0 1.5px,transparent 2.4px),radial-gradient(circle at 72% 40%,rgba(255,255,255,.8) 0 1px,transparent 2px),linear-gradient(135deg,#f6d4e4 0%,#eadcf7 43%,#c9ecf1 100%); background-size:105px 105px,160px 160px,80px 80px,100% 100%; font:15px/1.7 "Microsoft YaHei","Yu Gothic UI",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body::before,body::after { position:fixed; z-index:-1; width:24rem; height:24rem; content:""; filter:blur(2px); opacity:.55; pointer-events:none; }
body::before { top:6rem; left:-11rem; border-radius:55% 45% 63% 37%; background:#ffb2cf; }
body::after { right:-12rem; bottom:1rem; border-radius:43% 57% 35% 65%; background:#9cdbeb; }
header { position:relative; overflow:hidden; padding:3.25rem max(2rem,calc((100vw - 1380px)/2)); color:#fff; text-align:center; text-shadow:0 2px 12px rgba(92,48,104,.28); background:linear-gradient(120deg,#e576aa 0%,#ae94e1 50%,#78cbd8 100%); }
header::before { position:absolute; top:-6.5rem; left:-4rem; width:18rem; height:18rem; border:2px solid rgba(255,255,255,.25); border-radius:50%; content:""; box-shadow:20rem 8rem 0 -5rem rgba(255,255,255,.13),51rem -4rem 0 -4rem rgba(255,255,255,.16); }
header::after { position:absolute; right:7%; bottom:-2.1rem; color:rgba(255,255,255,.15); content:"✦  ♡  ✦  ♡  ✦"; font-size:clamp(2.5rem,6vw,5.2rem); letter-spacing:.25em; transform:rotate(-7deg); }
h1 { position:relative; z-index:1; margin:0; font-family:"Yu Mincho","Noto Serif CJK SC","Microsoft YaHei",serif; font-size:clamp(2rem,4vw,3rem); font-weight:800; letter-spacing:.12em; }
header p { position:relative; z-index:1; margin:.6rem 0 0; font-weight:600; letter-spacing:.05em; opacity:.94; }
.layout { max-width:1400px; margin:0 auto; padding:2rem; }
nav,main,.repo-panel { border:1px solid rgba(255,255,255,.78); border-radius:22px; background:var(--paper); box-shadow:0 15px 45px rgba(103,76,129,.14),inset 0 1px 0 rgba(255,255,255,.8); backdrop-filter:blur(14px); }
nav { max-height:22rem; margin-bottom:1.6rem; overflow:auto; padding:1.15rem 1.25rem 1.35rem; }
nav::before { display:block; margin:-.2rem 0 .6rem; color:var(--pink-deep); content:"✦ contents ✦"; font-size:.76rem; font-weight:800; letter-spacing:.12em; text-align:center; }
nav h2 { margin:0 0 .7rem; color:#725486; font-size:1.05rem; text-align:center; }
nav ul { margin:.18rem 0; padding-left:1rem; list-style:none; }
nav li { margin:.22rem 0; }
nav a { display:inline-block; color:#9b4e77; text-decoration:none; overflow-wrap:anywhere; transition:transform .18s ease,color .18s ease; }
nav a::before { content:"♡ "; color:var(--pink); }
nav a:hover { color:var(--pink-deep); transform:translateX(3px); }
.nav-folder { color:#715a9b; font-weight:800; }
.nav-folder::before { content:"✿ "; color:#e681aa; }
.nav-folder-details { margin:.15rem 0; }
.nav-folder-details > summary { padding:.12rem .25rem; border-radius:8px; cursor:pointer; list-style:none; transition:background .18s ease; }
.nav-folder-details > summary::-webkit-details-marker { display:none; }
.nav-folder-details > summary::after { float:right; color:#c88bad; content:"＋"; font-size:.8rem; }
.nav-folder-details[open] > summary::after { content:"－"; }
.nav-folder-details > summary:hover { background:rgba(239,146,181,.12); }
main { min-width:0; padding:clamp(1.3rem,3vw,2.7rem); }
.repo-panel { margin-bottom:1.6rem; padding:1.1rem 1.2rem 1.2rem; }
.repo-panel h2 { margin:0 0 .7rem; color:#72507e; font-family:"Yu Mincho","Noto Serif CJK SC","Microsoft YaHei",serif; font-size:1.3rem; }
.repo-panel h2::before { margin-right:.45rem; color:var(--pink); content:"✦"; }
.repo-form { display:grid; grid-template-columns:minmax(0,1fr) 120px auto; gap:.65rem; align-items:end; }
.field { min-width:0; }
.field label { display:block; margin:0 0 .25rem .15rem; color:#816c8c; font-size:.78rem; font-weight:800; }
.field input { width:100%; min-width:0; padding:.65rem .75rem; color:var(--ink); border:1px solid rgba(196,142,190,.45); border-radius:10px; outline:0; background:rgba(255,255,255,.75); font:inherit; transition:border-color .18s,box-shadow .18s; }
.field input:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(239,146,181,.2); }
.load-button { min-height:2.75rem; padding:.65rem 1rem; color:#fff; border:0; border-radius:999px; background:linear-gradient(110deg,#e977a8,#9b83d1); box-shadow:0 6px 15px rgba(167,103,159,.25); font:700 .9rem/1 "Microsoft YaHei",sans-serif; white-space:nowrap; cursor:pointer; transition:transform .18s ease,filter .18s ease; }
.load-button:hover:not(:disabled),.load-button:focus-visible:not(:disabled) { filter:brightness(1.06); transform:translateY(-2px); }
.load-button:disabled { cursor:wait; opacity:.6; }
.status { min-height:1.55rem; margin:.8rem 0 0; color:var(--muted); font-size:.9rem; }
.status[data-state="error"] { color:#c3536c; font-weight:700; }
.status[data-state="success"] { color:#3e9586; font-weight:700; }
.directory { margin:0 0 1.1rem; }
.directory > summary { display:flex; align-items:center; gap:.55rem; margin:2.9rem 0 1.1rem; padding-bottom:.55rem; color:#72507e; border-bottom:2px solid rgba(231,138,180,.35); cursor:pointer; list-style:none; font-family:"Yu Mincho","Noto Serif CJK SC","Microsoft YaHei",serif; }
.directory > summary::-webkit-details-marker { display:none; }
.directory > summary::before { color:var(--pink); content:"✿"; }
.directory > summary::after { margin-left:auto; color:#c88bad; content:"⌄"; font-family:Arial,sans-serif; font-size:1.15rem; transition:transform .18s ease; }
.directory[open] > summary::after { transform:rotate(180deg); }
.directory > summary:hover { color:var(--pink-deep); }
.directory h1 { font-size:1.95rem; }.directory h2 { font-size:1.62rem; }.directory h3 { font-size:1.34rem; }.directory h4,.directory h5,.directory h6 { font-size:1.1rem; }
.directory > .directory { margin-left:1rem; }
.code-file { position:relative; margin:1.4rem 0 2rem; scroll-margin-top:1rem; }
.code-file + .code-file { margin-top:1.7rem; }
.file-name { margin:0; padding:.68rem 4.9rem .68rem 1rem; color:#fff; border-radius:14px 14px 0 0; background:linear-gradient(100deg,#dc78a6,#a385d1); box-shadow:0 7px 18px rgba(167,103,159,.2); font:700 .94rem/1.35 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; overflow-wrap:anywhere; }
.file-name::before { margin-right:.45rem; content:"✦"; color:#fff1a8; }
.copy-button { position:absolute; z-index:1; top:.43rem; right:.58rem; display:inline-flex; align-items:center; gap:.32rem; min-height:2rem; padding:.38rem .68rem; color:#735179; border:1px solid rgba(255,255,255,.85); border-radius:999px; outline:0; background:rgba(255,255,255,.92); box-shadow:0 3px 9px rgba(77,40,79,.15); font:700 .77rem/1 "Microsoft YaHei",sans-serif; cursor:pointer; transition:transform .18s ease,background .18s ease,color .18s ease; }
.copy-button:hover:not(:disabled),.copy-button:focus-visible:not(:disabled) { color:#fff; background:#ef7faa; transform:translateY(-2px) scale(1.03); }
.copy-button:disabled { cursor:wait; opacity:.7; }.copy-button.is-copied { color:#fff; background:#66bfae; }.copy-button.is-failed { color:#fff; background:#cf6a79; }
.copy-button .copy-icon { font-size:.95rem; line-height:1; }
pre { position:relative; min-height:4.8rem; margin:0; padding:1.3rem 1.2rem; overflow:auto; border:1px solid rgba(255,255,255,.14); border-top:0; border-radius:0 0 14px 14px; background:linear-gradient(135deg,var(--code-top),var(--code)); color:#f9f3ff; box-shadow:0 12px 24px rgba(45,33,67,.16); font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; tab-size:4; }
pre::before { position:absolute; top:.5rem; right:1rem; color:rgba(255,255,255,.22); content:"● ● ●"; letter-spacing:.16em; font-size:.55rem; } code { font-family:inherit; }.loading-code { color:#cfc8e6; font-family:"Microsoft YaHei",sans-serif; }.empty { color:var(--muted); }
@media (max-width:850px) { .layout { grid-template-columns:1fr; gap:1rem; padding:1rem; } nav { position:static; max-height:none; } header { padding:2.5rem 1rem; } main { padding:1.25rem; } }
@media (max-width:610px) { .repo-form { grid-template-columns:1fr 1fr; }.repo-form .field:first-child { grid-column:1 / -1; }.load-button { grid-column:1 / -1; } }
@media (max-width:420px) { h1 { letter-spacing:.06em; }.layout { padding:.65rem; }main { padding:1rem; }.file-name { font-size:.82rem; } }
@media print { body { background:#fff; } body::before,body::after,header::before,header::after { display:none; } header { padding:0 0 1rem; color:#000; text-shadow:none; background:#fff; }.layout { display:block; padding:0; }nav,.repo-panel,.copy-button { display:none; }main { padding:0; border:0; box-shadow:none; }pre { overflow:visible; white-space:pre-wrap; color:#000; border:1px solid #bbb; background:#fff; box-shadow:none; }.file-name { color:#000; background:#eee; } }
</style>
</head>
<body>
<header>
  <h1>代码星图</h1>
  <p>从 GitHub 仓库实时读取 · 展示常见代码文件</p>
</header>
<div class="layout">
  <nav aria-label="文件目录"><h2>仓库目录</h2><div id="navigation" class="empty">等待读取仓库…</div></nav>
  <main>
    <section class="repo-panel" aria-labelledby="repo-title">
      <h2 id="repo-title">连接 GitHub 仓库</h2>
      <form id="repo-form" class="repo-form">
        <div class="field"><label for="repository">仓库（owner/repository）</label><input id="repository" name="repository" placeholder="例如：octocat/Hello-World" autocomplete="off" required></div>
        <div class="field"><label for="branch">分支</label><input id="branch" name="branch" placeholder="main" autocomplete="off"></div>
        <button id="load-button" class="load-button" type="submit">读取代码 ✦</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite">正在识别 GitHub Pages 仓库…</p>
    </section>
    <section id="document" aria-live="polite"><p class="empty">请输入公开仓库，或部署到 GitHub Pages 后自动读取当前仓库。</p></section>
  </main>
</div>
<script>
(() => {
  // 自定义域名或非标准 Pages 地址可在此预先填写；常规 owner.github.io/repository 地址会自动识别。
  const SITE_CONFIG = { repository: '', branch: '' };
  const apiRoot = 'https://api.github.com';
  const rawRoot = 'https://raw.githubusercontent.com';
  const codeExtensions = new Set([
    'py', 'pyw', 'js', 'jsx', 'mjs', 'cjs', 'ts', 'tsx', 'vue', 'svelte',
    'html', 'htm', 'css', 'scss', 'sass', 'less', 'json', 'jsonc', 'xml',
    'yaml', 'yml', 'toml', 'ini', 'java', 'kt', 'kts', 'go', 'rs', 'c', 'h',
    'cc', 'cpp', 'cxx', 'hh', 'hpp', 'cs', 'php', 'rb', 'swift', 'dart',
    'sh', 'bash', 'zsh', 'fish', 'ps1', 'bat', 'cmd', 'sql', 'lua', 'r',
    'pl', 'ex', 'exs', 'erl', 'hrl', 'hs', 'fs', 'fsx', 'gradle', 'graphql',
    'gql', 'proto', 'tf', 'sol', 'asm', 'md', 'markdown'
  ]);
  const codeNames = new Set([
    'Dockerfile', 'Makefile', 'CMakeLists.txt', 'Rakefile', 'Gemfile',
    'Procfile', 'Vagrantfile', '.gitignore', '.gitattributes', '.editorconfig',
    'requirements.txt', 'pyproject.toml', 'package.json', 'tsconfig.json'
  ]);
  const form = document.querySelector('#repo-form');
  const repositoryInput = document.querySelector('#repository');
  const branchInput = document.querySelector('#branch');
  const loadButton = document.querySelector('#load-button');
  const status = document.querySelector('#status');
  const navigation = document.querySelector('#navigation');
  const documentRoot = document.querySelector('#document');
  let loadVersion = 0;

  const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/');
  const setStatus = (message, state = '') => { status.textContent = message; status.dataset.state = state; };
  const setLoading = (loading) => { loadButton.disabled = loading; loadButton.textContent = loading ? '读取中…' : '读取代码 ✦'; };

  function inferRepository() {
    const query = new URLSearchParams(window.location.search);
    if (query.get('repo')) return { repository: query.get('repo'), branch: query.get('branch') || '' };
    if (SITE_CONFIG.repository) return SITE_CONFIG;
    const hostMatch = window.location.hostname.match(/^([^.:]+)\.github\.io$/i);
    if (!hostMatch) return null;
    const owner = hostMatch[1];
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    return { repository: `${owner}/${pathParts[0] || `${owner}.github.io`}`, branch: '' };
  }

  function parseRepository(value) {
    const parts = value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').split('/').filter(Boolean);
    if (parts.length !== 2) throw new Error('仓库格式应为 owner/repository。');
    return { owner: parts[0], repo: parts[1], repository: `${parts[0]}/${parts[1]}` };
  }

  async function githubJson(url) {
    const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      const reset = response.headers.get('x-ratelimit-reset');
      const rateHint = response.status === 403 && reset ? ` API 限流，请稍后重试。` : '';
      throw new Error(detail.message ? `${detail.message}${rateHint}` : `GitHub 请求失败（${response.status}）。`);
    }
    return response.json();
  }

  function buildTree(files) {
    const root = { dirs: new Map(), files: [] };
    files.forEach((file) => {
      const parts = file.path.split('/');
      let node = root;
      parts.slice(0, -1).forEach((folder) => {
        if (!node.dirs.has(folder)) node.dirs.set(folder, { dirs: new Map(), files: [] });
        node = node.dirs.get(folder);
      });
      node.files.push(file);
    });
    return root;
  }

  const orderedEntries = (map) => [...map.entries()].sort(([a], [b]) => a.localeCompare(b, 'zh-CN'));
  const orderedFiles = (files) => [...files].sort((a, b) => a.path.localeCompare(b.path, 'zh-CN'));
  const anchorFor = (path) => `file-${path.replace(/[^a-zA-Z0-9_-]/g, '-')}`;
  const isCodeFile = (path) => {
    const name = path.split('/').at(-1);
    if (codeNames.has(name)) return true;
    const dot = name.lastIndexOf('.');
    return dot > 0 && codeExtensions.has(name.slice(dot + 1).toLowerCase());
  };
  const languageFor = (path) => {
    const name = path.split('/').at(-1).toLowerCase();
    if (name === 'dockerfile') return 'dockerfile';
    const extension = name.includes('.') ? name.split('.').at(-1) : '';
    return extension || 'text';
  };

  function createCopyButton(code) {
    const button = document.createElement('button');
    button.className = 'copy-button';
    button.type = 'button';
    button.disabled = true;
    button.setAttribute('aria-label', '复制代码');
    button.innerHTML = '<span class="copy-icon" aria-hidden="true">⧉</span><span>加载中</span>';
    button.addEventListener('click', async () => {
      const text = code.textContent;
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); copied = true; }
        else copied = fallbackCopy(text);
      } catch (_) { copied = fallbackCopy(text); }
      button.classList.remove('is-copied', 'is-failed');
      button.classList.add(copied ? 'is-copied' : 'is-failed');
      button.querySelector('span:last-child').textContent = copied ? '已复制！' : '复制失败';
      window.setTimeout(() => { button.classList.remove('is-copied', 'is-failed'); button.querySelector('span:last-child').textContent = '复制'; }, 1800);
    });
    return button;
  }

  function fallbackCopy(text) {
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly', '');
    area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.appendChild(area); area.select();
    const copied = document.execCommand('copy'); area.remove();
    return copied;
  }

  function renderTree(tree) {
    const navList = document.createElement('ul');
    const content = document.createDocumentFragment();
    const fileViews = [];
    function renderNav(node, list) {
      orderedEntries(node.dirs).forEach(([folder, child]) => {
        const item = document.createElement('li'); const details = document.createElement('details');
        details.className = 'nav-folder-details'; details.open = true;
        const summary = document.createElement('summary'); const label = document.createElement('span');
        label.className = 'nav-folder'; label.textContent = folder; summary.appendChild(label); details.appendChild(summary);
        const nested = document.createElement('ul'); renderNav(child, nested); details.appendChild(nested); item.appendChild(details); list.appendChild(item);
      });
      orderedFiles(node.files).forEach((file) => {
        const item = document.createElement('li'); const link = document.createElement('a');
        link.href = `#${anchorFor(file.path)}`; link.textContent = file.path.split('/').at(-1); item.appendChild(link); list.appendChild(item);
      });
    }
    function renderContent(node, container, depth) {
      orderedEntries(node.dirs).forEach(([folder, child]) => {
        const section = document.createElement('details'); section.className = `directory depth-${depth}`; section.open = true;
        const summary = document.createElement('summary'); const heading = document.createElement(`h${Math.min(depth, 6)}`);
        heading.textContent = folder; summary.appendChild(heading); section.appendChild(summary);
        const inside = document.createDocumentFragment();
        renderContent(child, inside, depth + 1);
        section.appendChild(inside); container.appendChild(section);
      });
      orderedFiles(node.files).forEach((file) => {
        const article = document.createElement('article'); article.className = 'code-file'; article.id = anchorFor(file.path);
        const title = document.createElement(`h${Math.min(depth, 6)}`); title.className = 'file-name'; title.textContent = file.path.split('/').at(-1);
        const pre = document.createElement('pre'); const code = document.createElement('code'); code.className = `language-${languageFor(file.path)} loading-code`; code.textContent = '正在读取代码…';
        pre.appendChild(code); article.append(title, pre);
        const button = createCopyButton(code); article.appendChild(button); content.appendChild(article);
        fileViews.push({ file, code, button });
      });
    }
    renderNav(tree, navList); renderContent(tree, content, 1);
    navigation.replaceChildren(navList); documentRoot.replaceChildren(content);
    return fileViews;
  }

  async function mapConcurrent(items, limit, worker) {
    let nextIndex = 0;
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (nextIndex < items.length) { const current = nextIndex++; await worker(items[current], current); }
    }));
  }

  async function loadRepository(repositoryValue, requestedBranch) {
    const version = ++loadVersion;
    let repo;
    try { repo = parseRepository(repositoryValue); }
    catch (error) { setStatus(error.message, 'error'); return; }
    repositoryInput.value = repo.repository;
    setLoading(true); navigation.textContent = '正在读取目录…'; documentRoot.replaceChildren();
    try {
      setStatus('正在读取仓库信息…');
      const metadata = await githubJson(`${apiRoot}/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}`);
      const branch = requestedBranch.trim() || metadata.default_branch;
      branchInput.value = branch;
      setStatus(`正在获取 ${branch} 分支目录…`);
      const tree = await githubJson(`${apiRoot}/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
      if (version !== loadVersion) return;
      if (tree.truncated) throw new Error('仓库目录过大，GitHub 返回的递归目录不完整，无法安全展示。');
      const files = tree.tree.filter((item) => item.type === 'blob' && isCodeFile(item.path)).sort((a, b) => a.path.localeCompare(b.path, 'zh-CN'));
      if (!files.length) { navigation.textContent = '未找到代码文件。'; documentRoot.innerHTML = '<p class="empty">该分支中未找到可展示的代码文件。</p>'; setStatus('读取完成：未找到代码文件。', 'success'); return; }
      const views = renderTree(buildTree(files));
      let completed = 0;
      setStatus(`已找到 ${files.length} 个代码文件，正在加载（0/${files.length}）…`);
      const sourceRef = tree.sha;
      await mapConcurrent(views, 8, async ({ file, code, button }) => {
        try {
          const rawUrl = `${rawRoot}/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/${encodeURIComponent(sourceRef)}/${encodePath(file.path)}`;
          const response = await fetch(rawUrl);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          code.textContent = await response.text(); code.classList.remove('loading-code'); button.disabled = false; button.querySelector('span:last-child').textContent = '复制';
        } catch (error) {
          code.textContent = `读取失败：${error.message}`; code.classList.remove('loading-code'); button.querySelector('span:last-child').textContent = '不可复制';
        } finally {
          completed += 1;
          if (version === loadVersion) setStatus(`已找到 ${files.length} 个代码文件，正在加载（${completed}/${files.length}）…`);
        }
      });
      if (version === loadVersion) {
        const query = new URLSearchParams({ repo: repo.repository, branch });
        history.replaceState(null, '', `${window.location.pathname}?${query.toString()}`);
        setStatus(`读取完成：${repo.repository} · ${branch} · ${files.length} 个代码文件`, 'success');
      }
    } catch (error) {
      if (version === loadVersion) {
        navigation.textContent = '无法读取目录。';
        documentRoot.innerHTML = '<p class="empty">请确认仓库为公开仓库，名称与分支正确，并稍后重试。</p>';
        setStatus(`读取失败：${error.message}`, 'error');
      }
    } finally { if (version === loadVersion) setLoading(false); }
  }

  form.addEventListener('submit', (event) => { event.preventDefault(); loadRepository(repositoryInput.value, branchInput.value); });
  const initial = inferRepository();
  if (initial) { repositoryInput.value = initial.repository; branchInput.value = initial.branch || ''; loadRepository(initial.repository, initial.branch || ''); }
  else { setStatus('未识别当前仓库：请输入公开 GitHub 仓库后读取。'); }
})();
</script>
