<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="动态读取 GitHub 仓库中代码文件的代码文档。二次元风格，左侧可折叠目录。">
<title>小河的代码星图</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ff8fb8' stroke='%23c2558a' stroke-width='3' stroke-linejoin='round' d='M32 4l7 17 17 7-17 7-7 17-7-17-17-7 17-7z'/%3E%3Ccircle cx='32' cy='28' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root {
  --ink:#5a4a78; --muted:#9b8ab0;
  --paper:rgba(255,255,255,.92); --line:rgba(255,140,180,.28);
  --pink:#ff7fb0; --pink-deep:#f5639c; --pink-soft:#ffe3ee;
  --blue:#6fc3ff; --blue-deep:#3f9fe8; --blue-soft:#e3f2ff;
  --lemon:#ffd166; --lilac:#a78beb;
  --code-top:#3d2f6e; --code:#2b2350; --code-deep:#211a40;
  --radius-lg:22px; --radius-md:14px;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { min-height:100vh; margin:0; overflow-x:hidden; color:var(--ink);
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.9) 0 2px, transparent 2.6px) 0 0/16px 16px,
    radial-gradient(circle at 78% 72%, rgba(255,255,255,.55) 0 1.4px, transparent 2px) 0 0/24px 24px,
    linear-gradient(135deg,#fff1f8 0%,#f4eaff 46%,#e9f6ff 100%);
  font:15px/1.7 "Noto Sans SC","Yu Gothic UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body::before { position:fixed; z-index:-1; top:9rem; left:-9rem; width:20rem; height:20rem; border-radius:55% 45% 63% 37%; background:rgba(255,170,205,.5); filter:blur(3px); content:""; pointer-events:none; }
body::after { position:fixed; z-index:-1; right:-10rem; bottom:2rem; width:22rem; height:22rem; border-radius:43% 57% 35% 65%; background:rgba(140,205,255,.5); filter:blur(3px); content:""; pointer-events:none; }

/* ===== 顶部标题 ===== */
header { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:1rem;
  padding:.9rem clamp(1rem,3vw,2.2rem); color:#fff; text-shadow:0 2px 8px rgba(122,62,120,.25);
  background:linear-gradient(115deg,#ff8fb8 0%,#c49cf0 45%,#7cc6f5 100%);
  box-shadow:0 6px 22px rgba(180,110,170,.28); }
header::after { position:absolute; right:6%; bottom:-1.15rem; color:rgba(255,255,255,.32); content:"✦ ✦ ✦"; font-size:2rem; letter-spacing:.6em; transform:rotate(-6deg); pointer-events:none; }
#nav-toggle { display:inline-flex; align-items:center; justify-content:center; width:2.8rem; height:2.8rem; flex:0 0 auto;
  color:#fff; border:2px solid rgba(255,255,255,.75); border-radius:50%; background:rgba(255,255,255,.18); cursor:pointer;
  transition:transform .18s ease,background .18s ease; }
#nav-toggle:hover { background:rgba(255,255,255,.32); transform:scale(1.08) rotate(-6deg); }
#nav-toggle svg { width:1.35rem; height:1.35rem; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
#nav-toggle svg.open-icon { display:none; }
#nav-toggle.is-open svg.open-icon { display:block; }
#nav-toggle.is-open svg.closed-icon { display:none; }
.header-title { min-width:0; }
h1 { margin:0; font-family:"ZCOOL KuaiLe","Yu Mincho","Microsoft YaHei",serif; font-size:clamp(1.5rem,3.4vw,2.3rem); font-weight:400; letter-spacing:.1em; line-height:1.2;
  text-shadow:0 2px 0 rgba(148,72,120,.28),0 5px 16px rgba(255,255,255,.35); }
header p { margin:.15rem 0 0; font-weight:600; font-size:.88rem; letter-spacing:.06em; opacity:.95; }

/* ===== 左右布局 ===== */
.layout { display:flex; align-items:flex-start; gap:1.4rem; max-width:1500px; margin:0 auto; padding:1.6rem clamp(1rem,2.5vw,2.4rem) 2.4rem; }

/* 左侧目录（可折叠） */
.sidebar { width:320px; flex:0 0 auto; position:sticky; top:5.6rem; display:flex; flex-direction:column;
  max-height:calc(100vh - 7rem); border:1px solid rgba(255,255,255,.85); border-radius:var(--radius-lg);
  background:var(--paper); box-shadow:0 16px 40px rgba(150,100,160,.14),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(14px); overflow:hidden; transition:width .26s ease,transform .26s ease; }
.sidebar.collapsed { width:0; border:0; box-shadow:none; }
.sidebar-head { display:flex; align-items:center; gap:.5rem; padding:.85rem 1.1rem .7rem; color:var(--pink-deep);
  font-family:"ZCOOL KuaiLe","Microsoft YaHei",sans-serif; font-size:1.06rem; letter-spacing:.08em; white-space:nowrap; }
.sidebar-head svg { width:1.05rem; height:1.05rem; fill:var(--lemon); stroke:var(--pink-deep); stroke-width:1.4; stroke-linejoin:round; }
.repo-panel { margin:.1rem .9rem .85rem; padding:.9rem .95rem 1rem; border:1px solid rgba(255,170,205,.4); border-radius:var(--radius-md); background:rgba(255,245,250,.75); }
.repo-form { display:flex; flex-direction:column; gap:.6rem; }
.field { min-width:0; }
.field label { display:block; margin:0 0 .22rem .15rem; color:#a37b97; font-size:.76rem; font-weight:700; }
.field input, .field select { width:100%; min-width:0; padding:.58rem .7rem; color:var(--ink); border:1.5px solid rgba(255,150,190,.5); border-radius:12px; outline:0; background:rgba(255,255,255,.85); font:inherit; transition:border-color .18s,box-shadow .18s; }
.field select { cursor:pointer; appearance:auto; }
.field input:focus, .field select:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,127,176,.18); }
.load-button { min-height:2.75rem; padding:.55rem .9rem; color:#fff; border:0; border-radius:999px;
  background:linear-gradient(110deg,#ff8fb8,#b78df0); box-shadow:0 6px 14px rgba(235,120,170,.3); font:700 .9rem/1 "Noto Sans SC","Microsoft YaHei",sans-serif; white-space:nowrap; cursor:pointer;
  transition:transform .16s ease,filter .16s ease,box-shadow .16s ease; }
.load-button:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-2px); box-shadow:0 9px 18px rgba(235,120,170,.38); }
.load-button:disabled { cursor:wait; opacity:.6; }
.status { min-height:1.4rem; margin:.1rem .9rem .85rem; color:var(--muted); font-size:.82rem; line-height:1.5; }
.status[data-state="error"] { color:#d2556f; font-weight:700; }
.status[data-state="success"] { color:#3ea08a; font-weight:700; }
.sidebar-title { display:flex; align-items:center; gap:.45rem; margin:0 .95rem .5rem; padding:.6rem 0; color:#c06a9a;
  border-top:2px dashed rgba(255,150,190,.35); font-family:"ZCOOL KuaiLe","Microsoft YaHei",sans-serif; font-size:.98rem; letter-spacing:.1em; }
.sidebar-title::before { content:""; width:.65rem; height:.65rem; flex:0 0 auto; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--blue)); }
.nav-tree { flex:1 1 auto; min-height:0; overflow:auto; margin:0 .9rem .9rem; padding:.4rem .6rem .5rem; border:1px solid rgba(255,170,205,.28); border-radius:var(--radius-md); background:rgba(255,250,253,.6); }
.nav-tree ul { margin:.18rem 0; padding-left:.85rem; list-style:none; }
.nav-tree a { display:inline-block; color:#b05f8c; text-decoration:none; overflow-wrap:anywhere; padding:.08rem .2rem; border-radius:8px; transition:transform .15s ease,color .15s ease,background .15s ease; }
.nav-tree a::before { content:"✦ "; color:var(--pink); font-size:.8em; }
.nav-tree a:hover { color:var(--pink-deep); background:rgba(255,127,176,.1); transform:translateX(3px); }
.nav-folder { color:#7a63a8; font-weight:800; }
.nav-folder::before { content:"✿ "; color:#ea87b4; }
.nav-folder-details { margin:.12rem 0; }
.nav-folder-details > summary { padding:.1rem .3rem; border-radius:8px; cursor:pointer; list-style:none; transition:background .16s ease; }
.nav-folder-details > summary::-webkit-details-marker { display:none; }
.nav-folder-details > summary::after { float:right; color:#e09bc0; content:"＋"; font-size:.72rem; line-height:1.7; }
.nav-folder-details[open] > summary::after { content:"－"; }
.nav-folder-details > summary:hover { background:rgba(255,127,176,.12); }
.empty { color:var(--muted); }

/* 右侧内容 */
main { min-width:0; flex:1 1 auto; border:1px solid rgba(255,255,255,.85); border-radius:var(--radius-lg);
  padding:clamp(1.2rem,2.6vw,2.3rem); background:var(--paper); box-shadow:0 16px 40px rgba(150,100,160,.14),inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter:blur(14px); }
.content-intro { display:flex; flex-direction:column; align-items:center; gap:.7rem; margin:3.2rem auto; max-width:34rem; text-align:center; }
.content-intro .star-badge { display:inline-flex; align-items:center; justify-content:center; width:5rem; height:5rem; border-radius:50%;
  background:linear-gradient(140deg,#ffe3ee,#e3f2ff); box-shadow:0 10px 26px rgba(220,140,190,.25); }
.content-intro .star-badge svg { width:2.6rem; height:2.6rem; fill:var(--lemon); stroke:var(--pink-deep); stroke-width:1.6; stroke-linejoin:round; }
.content-intro h2 { margin:0; color:#b86394; font-family:"ZCOOL KuaiLe","Microsoft YaHei",sans-serif; font-weight:400; font-size:1.35rem; letter-spacing:.1em; }
.content-intro p { margin:0; color:var(--muted); }

/* 目录分组（内容区里的文件夹 details） */
.directory { margin:0 0 1.1rem; }
.directory > summary { display:flex; align-items:center; gap:.55rem; margin:2.6rem 0 1rem; padding-bottom:.5rem; color:#7a63a8;
  border-bottom:2px solid rgba(255,140,180,.35); cursor:pointer; list-style:none; font-family:"ZCOOL KuaiLe","Noto Serif CJK SC","Microsoft YaHei",serif; }
.directory > summary::-webkit-details-marker { display:none; }
.directory > summary::before { color:var(--pink); content:"✿"; }
.directory > summary::after { margin-left:auto; color:#e09bc0; content:"⌄"; font-family:Arial,sans-serif; font-size:1.1rem; transition:transform .18s ease; }
.directory[open] > summary::after { transform:rotate(180deg); }
.directory > summary:hover { color:var(--pink-deep); }
.directory h1 { font-size:1.8rem; }.directory h2 { font-size:1.5rem; }.directory h3 { font-size:1.28rem; }.directory h4,.directory h5,.directory h6 { font-size:1.08rem; }
.directory > .directory { margin-left:1rem; }

/* 代码文件块 */
.code-file { position:relative; margin:1.4rem 0 2rem; scroll-margin-top:5.6rem; }
.code-file + .code-file { margin-top:1.7rem; }
.file-name { margin:0; padding:.68rem 4.9rem .68rem 1rem; color:#fff; border-radius:14px 14px 0 0;
  background:linear-gradient(100deg,#ff8fb8,#b78df0); box-shadow:0 7px 18px rgba(220,130,180,.22);
  font:700 .94rem/1.35 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; overflow-wrap:anywhere; }
.file-name::before { margin-right:.45rem; content:"✦"; color:#fff1a8; }
.copy-button { position:absolute; z-index:2; top:.43rem; right:.58rem; display:inline-flex; align-items:center; gap:.32rem; min-height:2rem; padding:.38rem .68rem;
  color:#b76a90; border:1.5px solid rgba(255,255,255,.9); border-radius:999px; outline:0; background:rgba(255,255,255,.94); box-shadow:0 3px 9px rgba(120,60,110,.16);
  font:700 .77rem/1 "Noto Sans SC","Microsoft YaHei",sans-serif; cursor:pointer; transition:transform .16s ease,background .16s ease,color .16s ease; }
.copy-button:hover:not(:disabled) { color:#fff; background:#f57aa8; transform:translateY(-2px) scale(1.04); }
.copy-button:disabled { cursor:wait; opacity:.7; }
.copy-button.is-copied { color:#fff; background:#5fc4a8; }
.copy-button.is-failed { color:#fff; background:#d96d80; }
.copy-button .copy-icon { font-size:.95rem; line-height:1; }
pre { position:relative; min-height:4.8rem; margin:0; padding:1.35rem 1.25rem; overflow:auto; border:1px solid rgba(255,255,255,.16); border-top:0; border-radius:0 0 14px 14px;
  background:linear-gradient(155deg,var(--code-top) 0%,var(--code) 52%,var(--code-deep) 100%); color:#f9f3ff;
  box-shadow:0 14px 26px rgba(60,45,105,.22); font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; tab-size:4; }
pre::before { position:absolute; top:.5rem; right:1rem; content:"★ ★ ★"; color:rgba(255,255,255,.2); font-size:.5rem; letter-spacing:.22em; }
pre::after { position:absolute; inset:0; border-radius:0 0 14px 14px; pointer-events:none; content:"";
  background-image:radial-gradient(circle at 12% 18%, rgba(255,255,255,.5) 0 .6px, transparent 1px),
    radial-gradient(circle at 68% 34%, rgba(255,255,255,.4) 0 .6px, transparent 1px),
    radial-gradient(circle at 42% 78%, rgba(255,255,255,.35) 0 .6px, transparent 1px),
    radial-gradient(circle at 88% 62%, rgba(255,255,255,.4) 0 .6px, transparent 1px); }
code { font-family:inherit; position:relative; z-index:1; }
.loading-code { color:#cfc8e6; font-family:"Noto Sans SC","Microsoft YaHei",sans-serif; }

/* 移动端抽屉遮罩 */
.nav-mask { position:fixed; inset:0; z-index:45; display:none; background:rgba(90,70,120,.32); backdrop-filter:blur(2px); }
.nav-mask.show { display:block; }

/* ===== 响应式 ===== */
@media (max-width:1020px) {
  .sidebar { width:280px; }
}
@media (max-width:850px) {
  .layout { padding:1rem .8rem 1.6rem; }
  .sidebar { position:fixed; z-index:50; top:0; left:0; bottom:0; width:min(320px,86vw); max-height:none;
    border-radius:0 var(--radius-lg) var(--radius-lg) 0; transform:translateX(-105%); box-shadow:0 20px 50px rgba(120,80,130,.3); }
  .sidebar.open { transform:translateX(0); }
  main { padding:1.2rem 1rem; border-radius:var(--radius-lg); }
  .content-intro { margin:2rem auto; }
  .field input { font-size:16px; }
  header p { font-size:.9rem; }
  .status { font-size:.88rem; }
}
@media (max-width:430px) {
  header { gap:.65rem; padding:.8rem .8rem; }
  h1 { font-size:1.35rem; }
  header p { font-size:.88rem; }
}
@media print { body { background:#fff; } body::before,body::after,header::after { display:none; } header { position:static; color:#000; text-shadow:none; background:#fff; box-shadow:none; } #nav-toggle,.sidebar,.nav-mask,.copy-button { display:none; } .layout { display:block; padding:0; } main { border:0; box-shadow:none; padding:0; } pre { overflow:visible; white-space:pre-wrap; color:#000; border:1px solid #bbb; background:#fff; box-shadow:none; } .file-name { color:#000; background:#eee; } }
</style>
</head>
<body>
<header>
  <button id="nav-toggle" type="button" aria-label="切换目录" aria-expanded="true">
    <svg class="closed-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <svg class="open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div class="header-title">
    <h1>小河的代码星图</h1>
    <p>从 GitHub 仓库实时读取 · 展示常见代码文件</p>
  </div>
</header>
<div class="layout">
  <aside id="sidebar" class="sidebar" aria-label="仓库目录">
    <div class="sidebar-head"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 5.9L20 11.6l-5.6 2.7L12 20l-2.4-5.7L4 11.6l5.6-2.7z"/></svg>仓库目录</div>
    <section class="repo-panel" aria-labelledby="repo-title">
      <form id="repo-form" class="repo-form">
        <div class="field"><label for="repository">仓库 URL</label><input id="repository" name="repository" placeholder="例如：https://github.com/octocat/Hello-World 或 octocat/Hello-World" autocomplete="off" required></div>
        <div class="field"><label for="branch">分支</label><select id="branch" name="branch"><option value="">自动（默认分支）</option></select></div>
        <button id="load-button" class="load-button" type="submit">读取代码</button>
      </form>
    </section>
    <div class="sidebar-title">文件导航</div>
    <div id="navigation" class="nav-tree"><p class="empty">等待读取仓库…</p></div>
    <p id="status" class="status" role="status" aria-live="polite">正在识别 GitHub Pages 仓库…</p>
  </aside>
  <main aria-live="polite">
    <section id="document">
      <div class="content-intro">
        <span class="star-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.3L21 11l-6.4 2.7L12 20l-2.6-6.3L3 11l6.4-2.7z"/></svg></span>
        <h2>欢迎来到代码星图</h2>
        <p>在左侧输入公开 GitHub 仓库，或部署到 GitHub Pages 后自动读取当前仓库。<br>点击左侧目录可跳转到对应代码文件。</p>
      </div>
    </section>
  </main>
</div>
<div id="nav-mask" class="nav-mask"></div>
<script>
(() => {
  const SITE_CONFIG = { repository: '', branch: '' };
  const apiRoot = 'https://api.github.com';
  const rawRoot = 'https://raw.githubusercontent.com';
  const codeExtensions = new Set([
    'py', 'pyw', 'js', 'jsx', 'mjs', 'cjs', 'ts', 'tsx', 'vue', 'svelte',
    'html', 'htm', 'css', 'scss', 'sass', 'less', 'json', 'jsonc', 'xml',
    'yaml', 'yml', 'toml', 'ini', 'java', 'kt', 'kts', 'go', 'rs', 'c', 'h',
    'cc', 'cpp', 'cxx', 'hh', 'hpp', 'cs', 'php', 'rb', 'swift', 'dart',
    'sh', 'bash', 'zsh', 'fish', 'ps1', 'bat', 'cmd', 'sql', 'lua', 'r',
    'pl', 'ex', 'exs', 'erl', 'hrl', 'hs', 'fs', 'fsx', 'gradle', 'graphql',
    'gql', 'proto', 'tf', 'sol', 'asm', 'md', 'markdown'
  ]);
  const codeNames = new Set([
    'Dockerfile', 'Makefile', 'CMakeLists.txt', 'Rakefile', 'Gemfile',
    'Procfile', 'Vagrantfile', '.gitignore', '.gitattributes', '.editorconfig',
    'requirements.txt', 'pyproject.toml', 'package.json', 'tsconfig.json'
  ]);
  const form = document.querySelector('#repo-form');
  const repositoryInput = document.querySelector('#repository');
  const branchSelect = document.querySelector('#branch');
  const loadButton = document.querySelector('#load-button');
  const status = document.querySelector('#status');
  const navigation = document.querySelector('#navigation');
  const documentRoot = document.querySelector('#document');
  const sidebar = document.querySelector('#sidebar');
  const navToggle = document.querySelector('#nav-toggle');
  const navMask = document.querySelector('#nav-mask');
  let loadVersion = 0;
  const isNarrow = () => window.innerWidth <= 850;

  // ===== 侧栏折叠 =====
  function setSidebar(open) {
    if (isNarrow()) {
      sidebar.classList.toggle('open', open);
      navMask.classList.toggle('show', open);
      navToggle.classList.toggle('is-open', open);
      navToggle.setAttribute('aria-expanded', String(open));
    } else {
      const collapsed = !open;
      sidebar.classList.toggle('collapsed', collapsed);
      navToggle.classList.toggle('is-open', !collapsed);
      navToggle.setAttribute('aria-expanded', String(!collapsed));
    }
  }
  function toggleSidebar() {
    if (isNarrow()) setSidebar(!sidebar.classList.contains('open'));
    else setSidebar(sidebar.classList.contains('collapsed'));
  }
  navToggle.addEventListener('click', toggleSidebar);
  navMask.addEventListener('click', () => setSidebar(false));
  navigation.addEventListener('click', (event) => {
    if (event.target.closest('a') && isNarrow()) setSidebar(false);
  });
  window.addEventListener('resize', () => {
    if (isNarrow()) { sidebar.classList.remove('collapsed'); navToggle.classList.remove('is-open'); }
    else { sidebar.classList.remove('open'); navMask.classList.remove('show'); navToggle.classList.remove('is-open'); }
  });

  const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/');
  const setStatus = (message, state = '') => { status.textContent = message; status.dataset.state = state; };
  const setLoading = (loading) => { loadButton.disabled = loading; loadButton.textContent = loading ? '读取中…' : '读取代码'; };

  function inferRepository() {
    const query = new URLSearchParams(window.location.search);
    if (query.get('repo')) return { repository: query.get('repo'), branch: query.get('branch') || '' };
    if (SITE_CONFIG.repository) return SITE_CONFIG;
    const hostMatch = window.location.hostname.match(/^([^.:]+)\.github\.io$/i);
    if (!hostMatch) return null;
    const owner = hostMatch[1];
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    return { repository: `${owner}/${pathParts[0] || `${owner}.github.io`}`, branch: '' };
  }

  function parseRepository(value) {
    const parts = value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').split('/').filter(Boolean);
    if (parts.length !== 2) throw new Error('仓库格式应为 owner/repository。');
    return { owner: parts[0], repo: parts[1], repository: `${parts[0]}/${parts[1]}` };
  }

  async function githubJson(url) {
    const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      const reset = response.headers.get('x-ratelimit-reset');
      const rateHint = response.status === 403 && reset ? ` API 限流，请稍后重试。` : '';
      throw new Error(detail.message ? `${detail.message}${rateHint}` : `GitHub 请求失败（${response.status}）。`);
    }
    return response.json();
  }

  function buildTree(files) {
    const root = { dirs: new Map(), files: [] };
    files.forEach((file) => {
      const parts = file.path.split('/');
      let node = root;
      parts.slice(0, -1).forEach((folder) => {
        if (!node.dirs.has(folder)) node.dirs.set(folder, { dirs: new Map(), files: [] });
        node = node.dirs.get(folder);
      });
      node.files.push(file);
    });
    return root;
  }

  const orderedEntries = (map) => [...map.entries()].sort(([a], [b]) => a.localeCompare(b, 'zh-CN'));
  const orderedFiles = (files) => [...files].sort((a, b) => a.path.localeCompare(b.path, 'zh-CN'));
  const anchorFor = (path) => `file-${path.replace(/[^a-zA-Z0-9_-]/g, '-')}`;
  const isCodeFile = (path) => {
    const name = path.split('/').at(-1);
    if (codeNames.has(name)) return true;
    const dot = name.lastIndexOf('.');
    return dot > 0 && codeExtensions.has(name.slice(dot + 1).toLowerCase());
  };
  const languageFor = (path) => {
    const name = path.split('/').at(-1).toLowerCase();
    if (name === 'dockerfile') return 'dockerfile';
    const extension = name.includes('.') ? name.split('.').at(-1) : '';
    return extension || 'text';
  };

  function createCopyButton(code) {
    const button = document.createElement('button');
    button.className = 'copy-button';
    button.type = 'button';
    button.disabled = true;
    button.setAttribute('aria-label', '复制代码');
    button.innerHTML = '<span class="copy-icon" aria-hidden="true">⧉</span><span>加载中</span>';
    button.addEventListener('click', async () => {
      const text = code.textContent;
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); copied = true; }
        else copied = fallbackCopy(text);
      } catch (_) { copied = fallbackCopy(text); }
      button.classList.remove('is-copied', 'is-failed');
      button.classList.add(copied ? 'is-copied' : 'is-failed');
      button.querySelector('span:last-child').textContent = copied ? '已复制！' : '复制失败';
      window.setTimeout(() => { button.classList.remove('is-copied', 'is-failed'); button.querySelector('span:last-child').textContent = '复制'; }, 1800);
    });
    return button;
  }

  function fallbackCopy(text) {
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly', '');
    area.style.position = 'fixed'; area.style.opacity = '0';
    document.body.appendChild(area); area.select();
    const copied = document.execCommand('copy'); area.remove();
    return copied;
  }

  function renderTree(tree) {
    const navList = document.createElement('ul');
    const content = document.createDocumentFragment();
    const fileViews = [];
    function renderNav(node, list) {
      orderedEntries(node.dirs).forEach(([folder, child]) => {
        const item = document.createElement('li'); const details = document.createElement('details');
        details.className = 'nav-folder-details'; details.open = true;
        const summary = document.createElement('summary'); const label = document.createElement('span');
        label.className = 'nav-folder'; label.textContent = folder; summary.appendChild(label); details.appendChild(summary);
        const nested = document.createElement('ul'); renderNav(child, nested); details.appendChild(nested); item.appendChild(details); list.appendChild(item);
      });
      orderedFiles(node.files).forEach((file) => {
        const item = document.createElement('li'); const link = document.createElement('a');
        link.href = `#${anchorFor(file.path)}`; link.textContent = file.path.split('/').at(-1); item.appendChild(link); list.appendChild(item);
      });
    }
    function renderContent(node, container, depth) {
      orderedEntries(node.dirs).forEach(([folder, child]) => {
        const section = document.createElement('details'); section.className = `directory depth-${depth}`; section.open = true;
        const summary = document.createElement('summary'); const heading = document.createElement(`h${Math.min(depth, 6)}`);
        heading.textContent = folder; summary.appendChild(heading); section.appendChild(summary);
        const inside = document.createDocumentFragment();
        renderContent(child, inside, depth + 1);
        section.appendChild(inside); container.appendChild(section);
      });
      orderedFiles(node.files).forEach((file) => {
        const article = document.createElement('article'); article.className = 'code-file'; article.id = anchorFor(file.path);
        const title = document.createElement(`h${Math.min(depth, 6)}`); title.className = 'file-name'; title.textContent = file.path.split('/').at(-1);
        const pre = document.createElement('pre'); const code = document.createElement('code'); code.className = `language-${languageFor(file.path)} loading-code`; code.textContent = '正在读取代码…';
        pre.appendChild(code); article.append(title, pre);
        const button = createCopyButton(code); article.appendChild(button); container.appendChild(article);
        fileViews.push({ file, code, button });
      });
    }
    renderNav(tree, navList); renderContent(tree, content, 1);
    navigation.replaceChildren(navList); documentRoot.replaceChildren(content);
    return fileViews;
  }

  async function mapConcurrent(items, limit, worker) {
    let nextIndex = 0;
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (nextIndex < items.length) { const current = nextIndex++; await worker(items[current], current); }
    }));
  }

  async function loadRepository(repositoryValue, requestedBranch) {
    const version = ++loadVersion;
    let repo;
    try { repo = parseRepository(repositoryValue); }
    catch (error) { setStatus(error.message, 'error'); return; }
    repositoryInput.value = repo.repository;
    setLoading(true);
    branchSelect.replaceChildren(); branchSelect.append(new Option('读取分支中…', ''));
    navigation.replaceChildren(); navigation.append(Object.assign(document.createElement('p'), { className: 'empty', textContent: '正在读取目录…' }));
    documentRoot.replaceChildren();
    try {
      setStatus('正在读取仓库信息…');
      const metadata = await githubJson(`${apiRoot}/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}`);
      setStatus('正在获取分支列表…');
      const branches = await githubJson(`${apiRoot}/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/branches?per_page=100`);
      const branchNames = branches.map((b) => b.name);
      const wanted = (requestedBranch || '').trim();
      const targetBranch = wanted && branchNames.includes(wanted) ? wanted : metadata.default_branch;
      branchSelect.replaceChildren();
      branchNames.forEach((name) => branchSelect.append(new Option(name, name)));
      branchSelect.value = branchNames.includes(targetBranch) ? targetBranch : (branchNames[0] || '');
      const branch = branchSelect.value || metadata.default_branch;
      setStatus(`正在获取 ${branch} 分支目录…`);
      const tree = await githubJson(`${apiRoot}/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
      if (version !== loadVersion) return;
      if (tree.truncated) throw new Error('仓库目录过大，GitHub 返回的递归目录不完整，无法安全展示。');
      const files = tree.tree.filter((item) => item.type === 'blob' && isCodeFile(item.path)).sort((a, b) => a.path.localeCompare(b.path, 'zh-CN'));
      if (!files.length) {
        navigation.replaceChildren(); navigation.append(Object.assign(document.createElement('p'), { className: 'empty', textContent: '未找到代码文件。' }));
        documentRoot.innerHTML = '<div class="content-intro"><span class="star-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.3L21 11l-6.4 2.7L12 20l-2.6-6.3L3 11l6.4-2.7z"/></svg></span><h2>这个分支里没有代码文件</h2><p>换个分支或仓库试试。</p></div>';
        setStatus('读取完成：未找到代码文件。', 'success'); return;
      }
      const views = renderTree(buildTree(files));
      let completed = 0;
      setStatus(`已找到 ${files.length} 个代码文件，正在加载（0/${files.length}）…`);
      const sourceRef = tree.sha;
      await mapConcurrent(views, 8, async ({ file, code, button }) => {
        try {
          const rawUrl = `${rawRoot}/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/${encodeURIComponent(sourceRef)}/${encodePath(file.path)}`;
          const response = await fetch(rawUrl);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          code.textContent = await response.text(); code.classList.remove('loading-code'); button.disabled = false; button.querySelector('span:last-child').textContent = '复制';
        } catch (error) {
          code.textContent = `读取失败：${error.message}`; code.classList.remove('loading-code'); button.querySelector('span:last-child').textContent = '不可复制';
        } finally {
          completed += 1;
          if (version === loadVersion) setStatus(`已找到 ${files.length} 个代码文件，正在加载（${completed}/${files.length}）…`);
        }
      });
      if (version === loadVersion) {
        const query = new URLSearchParams({ repo: repo.repository, branch });
        history.replaceState(null, '', `${window.location.pathname}?${query.toString()}`);
        setStatus(`读取完成：${repo.repository} · ${branch} · ${files.length} 个代码文件`, 'success');
      }
    } catch (error) {
      if (version === loadVersion) {
        navigation.replaceChildren(); navigation.append(Object.assign(document.createElement('p'), { className: 'empty', textContent: '无法读取目录。' }));
        documentRoot.innerHTML = '<div class="content-intro"><span class="star-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.3L21 11l-6.4 2.7L12 20l-2.6-6.3L3 11l6.4-2.7z"/></svg></span><h2>读取失败了</h2><p>请确认仓库为公开仓库，名称与分支正确，并稍后重试。</p></div>';
        setStatus(`读取失败：${error.message}`, 'error');
      }
    } finally { if (version === loadVersion) setLoading(false); }
  }

  form.addEventListener('submit', (event) => { event.preventDefault(); loadRepository(repositoryInput.value, branchSelect.value || ''); });
  branchSelect.addEventListener('change', () => {
    if (repositoryInput.value.trim()) loadRepository(repositoryInput.value, branchSelect.value);
  });
  const initial = inferRepository();
  if (initial) { repositoryInput.value = initial.repository; loadRepository(initial.repository, initial.branch || ''); }
  else { setStatus('未识别当前仓库：请输入公开 GitHub 仓库后读取。'); }
})();
</script>
</body>
